# ZEAL Schedule Adaptation holiday test
# Test window: 1–6 September 2026, Europe/London local time.
# Import this as one Home Assistant automation and enable ZEAL Learning first.
# It uses ZEAL's canonical room thermostats, never edits the saved schedule, and
# restores the scheduled target five minutes after every test change.
# Delete or disable the automation after 6 September 2026.

alias: "ZEAL test - Schedule Adaptation - 1 to 6 September 2026"
description: >-
  Creates four reviewable ZEAL Learning proposals: temperature above schedule,
  temperature below schedule, transition earlier, and transition later.
mode: queued
max: 10

triggers:
  # 1–3 September: Bathroom requests the 14:00 target 20 minutes early.
  - trigger: time
    at: "13:40:00"
    id: bathroom_earlier
  - trigger: time
    at: "13:45:00"
    id: bathroom_restore

  # 4–6 September: Master Bedroom retains the previous target for 20 minutes
  # after the 14:00 transition, suggesting that 14:00 should move to 14:20.
  - trigger: time
    at: "14:20:00"
    id: bedroom_later
  - trigger: time
    at: "14:25:00"
    id: bedroom_restore

  # 1–3 September: Lounge is raised above its active 16:00 target.
  - trigger: time
    at: "16:30:00"
    id: lounge_above
  - trigger: time
    at: "16:35:00"
    id: lounge_restore

  # 1–3 September: Dining Room is lowered below its active 16:00 target.
  - trigger: time
    at: "16:45:00"
    id: dining_below
  - trigger: time
    at: "16:50:00"
    id: dining_restore

  - trigger: time
    at: "23:00:00"
    id: completed

conditions:
  - condition: template
    value_template: >-
      {{ '2026-09-01' <= now().date().isoformat() <= '2026-09-06' }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: bathroom_earlier
          - condition: template
            value_template: >-
              {{ now().date().isoformat() in
                 ['2026-09-01', '2026-09-02', '2026-09-03'] }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.zone_2_first_floor_bathroom_thermostat_zeal
            data:
              temperature: 18

      - conditions:
          - condition: trigger
            id: bathroom_restore
          - condition: template
            value_template: >-
              {{ now().date().isoformat() in
                 ['2026-09-01', '2026-09-02', '2026-09-03'] }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.zone_2_first_floor_bathroom_thermostat_zeal
            data:
              temperature: 16

      - conditions:
          - condition: trigger
            id: bedroom_later
          - condition: template
            value_template: >-
              {{ now().date().isoformat() in
                 ['2026-09-04', '2026-09-05', '2026-09-06'] }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.zone_2_first_floor_master_bedroom_thermostat_zeal
            data:
              temperature: 16

      - conditions:
          - condition: trigger
            id: bedroom_restore
          - condition: template
            value_template: >-
              {{ now().date().isoformat() in
                 ['2026-09-04', '2026-09-05', '2026-09-06'] }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.zone_2_first_floor_master_bedroom_thermostat_zeal
            data:
              temperature: 18

      - conditions:
          - condition: trigger
            id: lounge_above
          - condition: template
            value_template: >-
              {{ now().date().isoformat() in
                 ['2026-09-01', '2026-09-02', '2026-09-03'] }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.zone_1_ground_lounge_thermostat_zeal
            data:
              temperature: 21.5

      - conditions:
          - condition: trigger
            id: lounge_restore
          - condition: template
            value_template: >-
              {{ now().date().isoformat() in
                 ['2026-09-01', '2026-09-02', '2026-09-03'] }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.zone_1_ground_lounge_thermostat_zeal
            data:
              temperature: 20

      - conditions:
          - condition: trigger
            id: dining_below
          - condition: template
            value_template: >-
              {{ now().date().isoformat() in
                 ['2026-09-01', '2026-09-02', '2026-09-03'] }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.zone_1_ground_dining_room_thermostat_zeal
            data:
              temperature: 16.5

      - conditions:
          - condition: trigger
            id: dining_restore
          - condition: template
            value_template: >-
              {{ now().date().isoformat() in
                 ['2026-09-01', '2026-09-02', '2026-09-03'] }}
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: climate.zone_1_ground_dining_room_thermostat_zeal
            data:
              temperature: 18

      - conditions:
          - condition: trigger
            id: completed
          - condition: template
            value_template: "{{ now().date().isoformat() == '2026-09-06' }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "ZEAL Schedule Adaptation test complete"
              message: >-
                The six-day test has finished. Open ZEAL Learning Notifications.
                There should be four proposals: Lounge temperature increase,
                Dining Room temperature decrease, Bathroom 14:00 start moved
                earlier, and Master Bedroom 14:00 start moved later. Review them
                with Accept, Edit and accept, and Dismiss. Disable this automation.
