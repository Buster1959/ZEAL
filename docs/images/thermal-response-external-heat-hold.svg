<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t d">
 <title id="t">Suspected external heat training-hold example</title><desc id="d">A sudden room-temperature rise while zone heating is off. The interval is excluded from training until the response returns to normal.</desc>
 <rect width="1000" height="480" fill="white"/><text x="70" y="38" font-family="Arial" font-size="23" font-weight="700" fill="#202124">Suspected external heat — training hold</text><text x="70" y="62" font-family="Arial" font-size="13" fill="#5f6368">Illustrative log-burner episode · heating controls remain unchanged</text>
 <rect x="70" y="85" width="870" height="300" fill="#fafafa" stroke="#dadce0"/><rect x="360" y="85" width="360" height="300" fill="#fbbc04" opacity=".17"/><g stroke="#e5e7eb"><path d="M70 340H940M70 255H940M70 170H940M70 85H940"/><path d="M70 85V385M287 85V385M505 85V385M722 85V385M940 85V385"/></g>
 <g font-family="Arial" font-size="12" fill="#5f6368"><text x="38" y="344">18°C</text><text x="38" y="259">20°C</text><text x="38" y="174">22°C</text><text x="38" y="89">24°C</text><text x="70" y="405" text-anchor="middle">17:00</text><text x="287" y="405" text-anchor="middle">17:30</text><text x="505" y="405" text-anchor="middle">18:00</text><text x="722" y="405" text-anchor="middle">18:30</text><text x="940" y="405" text-anchor="middle">19:00</text></g>
 <path d="M70 340C300 336 600 328 940 308" fill="none" stroke="#9aa0a6" stroke-width="4" stroke-dasharray="8 5"/><text x="928" y="296" text-anchor="end" font-family="Arial" font-size="11" font-weight="700" fill="#5f6368">Expected response</text>
 <path d="M70 340L287 336L360 330C420 302 465 220 520 155S630 105 680 110S800 130 940 155" fill="none" stroke="#d93025" stroke-width="5"/><circle cx="360" cy="330" r="6" fill="#d93025"/><text x="375" y="313" font-family="Arial" font-size="12" font-weight="700" fill="#b3261e">Abrupt unexplained rise</text>
 <line x1="360" y1="85" x2="360" y2="385" stroke="#f9ab00" stroke-width="2" stroke-dasharray="5 5"/><line x1="720" y1="85" x2="720" y2="385" stroke="#f9ab00" stroke-width="2" stroke-dasharray="5 5"/><text x="540" y="109" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#7a4b00">Excluded · suspected external heat</text><text x="540" y="129" text-anchor="middle" font-family="Arial" font-size="11" fill="#7a4b00">Only this room’s model training pauses</text><text x="735" y="365" font-family="Arial" font-size="11" font-weight="700" fill="#137333">Normal response restored · training resumes</text>
 <rect x="70" y="360" width="870" height="16" fill="#e8eaed"/><text x="505" y="372" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#5f6368">Zone actuator OFF — no schedule, demand or thermostat change</text>
 <g font-family="Arial" font-size="11" fill="#3c4043"><line x1="70" y1="440" x2="98" y2="440" stroke="#d93025" stroke-width="4"/><text x="105" y="444">Measured room</text><line x1="245" y1="440" x2="273" y2="440" stroke="#9aa0a6" stroke-width="4" stroke-dasharray="7 4"/><text x="280" y="444">Expected</text><rect x="395" y="430" width="26" height="14" fill="#fbbc04" opacity=".35"/><text x="430" y="443">Training hold</text></g><text x="70" y="468" font-family="Arial" font-size="11" fill="#5f6368">Model-quality exclusion only — ZEAL does not claim fire or hazard detection.</text>
</svg>
